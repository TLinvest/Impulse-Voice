[package]
name = "impulse-voice-daemon"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Private, local voice dictation integrated directly into Illogical Impulse"
readme = "README.md"
repository = "https://github.com/dfoucaul/impulse-voice"
homepage = "https://github.com/dfoucaul/impulse-voice"
keywords = ["speech-to-text", "wayland", "hyprland", "quickshell", "parakeet"]
categories = ["multimedia::audio", "accessibility"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.16"
rubato = "0.16.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
transcribe-rs = { version = "0.3.8", features = ["onnx"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
